<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Workout Tracker{% endblock %}</title>

    <style>

        /* =========================================================
           RESET / BASE
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        header {
            height: 70px;
            border-bottom: 1px solid #252525;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo svg {
            width: 21px;
            height: 21px;
            color: #ff6b00;
        }

        .logo span {
            color: #ff6b00;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav a {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            color: #aaaaaa;
            transition: 0.2s;
        }

        .nav a:hover {
            color: #ffffff;
        }

        .nav a svg {
            width: 17px;
            height: 17px;
        }

        .nav .logout {
            color: #ff6b00;
        }


        /* =========================================================
           MAIN
           ========================================================= */

        main {
            min-height: calc(100vh - 70px);
            padding: 40px;
        }

        .home-container {
            max-width: 1100px;
            margin: 0 auto;
        }


        /* =========================================================
           AUTH
           ========================================================= */

        .auth-container {
            min-height: calc(100vh - 150px);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;

            background: #111111;
            border: 1px solid #252525;
            border-radius: 12px;

            padding: 35px;
        }

        .auth-card h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .auth-subtitle {
            color: #888888;
            margin-bottom: 30px;
        }


        /* =========================================================
           FORM
           ========================================================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
        }

        .form-group input {
            width: 100%;

            padding: 12px 14px;

            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 7px;

            color: #ffffff;
            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #ff6b00;
        }

        .form-group input::placeholder {
            color: #666666;
        }


        /* =========================================================
           INPUT WITH ICON
           ========================================================= */

        .input-with-icon {
            position: relative;
        }

        .input-with-icon svg {
            position: absolute;

            left: 14px;
            top: 50%;

            width: 17px;
            height: 17px;

            color: #888888;

            transform: translateY(-50%);
            pointer-events: none;
        }

        .input-with-icon input {
            padding-left: 42px;
        }


        /* =========================================================
           BUTTONS
           ========================================================= */

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 10px 16px;

            border: none;
            border-radius: 8px;

            background: #ff6b00;
            color: #ffffff;

            font-size: 14px;
            font-weight: 500;

            text-decoration: none;
            cursor: pointer;

            transition: background 0.2s ease;
        }

        .button:hover {
            background: #e55f00;
        }

        .button svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
        }

        .add-button {
            width: auto;
            padding: 11px 17px;
            white-space: nowrap;
        }

        .create-button {
            width: 100%;
            margin-top: 8px;
        }

        .empty-button {
            width: auto;
            padding: 12px 25px;
        }


        /* =========================================================
           DELETE BUTTONS
           ========================================================= */

        .delete-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            padding: 9px 14px;

            border: 1px solid #3a2020;
            border-radius: 8px;

            background: #171111;
            color: #e57373;

            font-size: 14px;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .delete-button:hover {
            background: #2a1515;
            border-color: #5a2525;
            color: #ff6b6b;
        }

        .delete-button svg {
            width: 16px;
            height: 16px;
        }

        .delete-workout-button {
            padding: 10px 14px;
        }

        .delete-exercise-button {
            padding: 7px 11px;
            font-size: 13px;
        }

        .icon-delete-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 32px;
            height: 32px;

            margin-left: auto;

            border: none;
            border-radius: 6px;

            background: transparent;
            color: #777777;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .icon-delete-button:hover {
            background: #241515;
            color: #e57373;
        }

        .icon-delete-button svg {
            width: 16px;
            height: 16px;
        }


        /* =========================================================
           ERRORS
           ========================================================= */

        .error {
            background: #2a1111;
            border: 1px solid #6b2020;
            color: #ff8585;

            padding: 12px;
            border-radius: 7px;

            margin-bottom: 20px;
        }


        /* =========================================================
           AUTH LINK
           ========================================================= */

        .auth-link {
            text-align: center;
            margin-top: 25px;
            color: #888888;
        }

        .auth-link a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            color: #ff6b00;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .auth-link a svg {
            width: 16px;
            height: 16px;
        }


        /* =========================================================
           FORM TITLE
           ========================================================= */

        .form-title {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 28px;
        }

        .form-title h1 {
            margin: 0 0 5px;
        }

        .form-title .auth-subtitle {
            margin: 0;
        }

        .form-title-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border-radius: 10px;

            background: #1a1a1a;
            color: #ff6b00;
        }

        .form-title-icon svg {
            width: 22px;
            height: 22px;
        }


        /* =========================================================
           HOME
           ========================================================= */

        .welcome {
            margin-bottom: 40px;
        }

        .welcome h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #888888;
            font-size: 17px;
        }

        .accent {
            color: #ff6b00;
        }


        /* =========================================================
           CARDS
           ========================================================= */

        .card {
            background: #111111;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 25px;
        }


        /* =========================================================
           PAGE HEADER
           ========================================================= */

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .page-subtitle {
            display: flex;
            align-items: center;
            gap: 6px;

            color: #888888;
        }

        .page-subtitle svg {
            width: 16px;
            height: 16px;
        }

        .page-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }


        /* =========================================================
           WORKOUT LIST
           ========================================================= */

        .workout-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .workout-card {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            transition: 0.2s;
        }

        .workout-card:hover {
            border-color: #ff6b00;
        }

        .workout-info {
            min-width: 0;
        }

        .workout-info h2 {
            margin-bottom: 8px;
        }

        .workout-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .workout-date {
            display: flex;
            align-items: center;
            gap: 6px;

            color: #777777;
        }

        .workout-date svg {
            width: 15px;
            height: 15px;
        }

        .details-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            color: #ff6b00;

            font-size: 14px;
            font-weight: 500;

            white-space: nowrap;

            transition: color 0.2s ease;
        }

        .details-link:hover {
            color: #e55f00;
        }

        .details-link svg {
            width: 17px;
            height: 17px;
        }


        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {
            text-align: center;
            padding: 60px 30px;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #777777;
            margin-bottom: 25px;
        }

        .empty-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 16px;
        }

        .empty-icon svg {
            width: 42px;
            height: 42px;

            color: #ff6b00;
            stroke-width: 1.5;
        }


        /* =========================================================
           ADD EXERCISE
           ========================================================= */

        .add-exercise-card {
            margin-bottom: 35px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 22px;
        }

        .section-title h2 {
            margin: 0 0 4px;
        }

        .section-title p {
            margin: 0;

            color: #888888;
            font-size: 14px;
        }

        .section-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border-radius: 9px;

            background: #1c1c1c;
            color: #ff6b00;
        }

        .section-icon svg {
            width: 20px;
            height: 20px;
        }


        /* =========================================================
           MUSCLE GROUPS
           ========================================================= */

        .muscle-groups {
            display: flex;
            gap: 10px;

            overflow-x: auto;

            padding: 5px 2px 15px;
            margin-bottom: 20px;

            scrollbar-width: thin;
        }

        .muscle-groups::-webkit-scrollbar {
            height: 5px;
        }

        .muscle-bubble {
            flex-shrink: 0;

            padding: 10px 18px;

            background: #181818;
            color: #aaaaaa;

            border: 1px solid #333333;
            border-radius: 50px;

            font-size: 14px;

            cursor: pointer;

            transition: 0.2s;
        }

        .muscle-bubble:hover {
            border-color: #ff6b00;
            color: #ffffff;
        }

        .muscle-bubble.active {
            background: #ff6b00;
            border-color: #ff6b00;
            color: #ffffff;
        }


        /* =========================================================
           EXERCISE FORM
           ========================================================= */

        .exercise-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .exercise-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            min-height: 50px;
        }

        .exercise-bubble {
            padding: 10px 16px;

            background: #181818;
            color: #aaaaaa;

            border: 1px solid #333333;
            border-radius: 50px;

            cursor: pointer;

            transition: 0.2s;
        }

        .exercise-bubble:hover {
            border-color: #ff6b00;
            color: #ffffff;
        }

        .exercise-bubble.active {
            background: #ff6b00;
            border-color: #ff6b00;
            color: #ffffff;
        }

        .exercise-form .button {
            align-self: flex-start;

            width: auto;
            min-width: 150px;
        }

        .add-exercise-button {
            padding: 10px 18px;
        }


        /* =========================================================
           WORKOUT CONTENT
           ========================================================= */

        .workout-content {
            margin-top: 10px;
        }

        .workout-content > h2 {
            margin-bottom: 20px;
        }


        /* =========================================================
           EXERCISE CARD
           ========================================================= */

        .workout-card .exercise-info {
            padding-top: 5px;
        }

        .exercise-title {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .exercise-title svg {
            width: 20px;
            height: 20px;

            color: #ff6b00;

            flex-shrink: 0;
        }

        .exercise-title h2 {
            margin: 0;
            font-size: 20px;
        }

        .exercise-header {
            margin-bottom: 22px;
        }


        /* =========================================================
           SETS
           ========================================================= */

        .sets-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sets-header {
            margin-bottom: 12px;
        }

        .sets-header h3 {
            margin: 0;

            font-size: 15px;
            color: #aaaaaa;
        }

        .sets-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .set-row {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 10px;
            border-radius: 8px;
        }

        .saved-set {
            background: #151515;
            border: 1px solid #252525;

            margin-bottom: 8px;
        }

        .new-set {
            margin-top: 10px;

            background: #111111;
            border: 1px dashed #333333;
        }

        .set-number {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 28px;
            height: 28px;

            flex-shrink: 0;

            border-radius: 6px;

            background: #222222;
            color: #999999;

            font-size: 13px;
        }

        .set-value {
            color: #dddddd;
            font-size: 14px;
        }

        .set-input {
            width: 130px;

            padding: 9px 11px;

            background: #0d0d0d;
            border: 1px solid #2c2c2c;
            border-radius: 7px;

            color: #ffffff;

            outline: none;
        }

        .set-input:focus {
            border-color: #ff6b00;
        }

        .set-input::placeholder {
            color: #666666;
        }

        .save-button {
            margin-left: auto;

            width: auto;

            padding: 9px 13px;
        }


        /* =========================================================
           EXERCISE DELETE
           ========================================================= */

        .exercise-delete-form {
            display: flex;
            justify-content: flex-end;

            margin: -18px 4px 24px 0;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
            }

            main {
                padding: 25px 20px;
            }

            .nav {
                gap: 12px;
            }

            .nav a {
                font-size: 14px;
            }

            .nav a:not(.logout) {
                font-size: 0;
            }

            .nav a:not(.logout) svg {
                width: 19px;
                height: 19px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-actions {
                width: 100%;
                justify-content: space-between;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .workout-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .details-link {
                margin-top: 4px;
            }

            .workout-card {
                gap: 25px;
            }

            .set-row {
                flex-wrap: wrap;
            }

            .set-input {
                flex: 1;
                min-width: 120px;
            }

            .save-button {
                width: 100%;
                margin-left: 0;
            }

            .icon-delete-button {
                margin-left: auto;
            }

            .exercise-delete-form {
                margin-top: -16px;
            }
        }


        /* =========================================================
           SMALL MOBILE
           ========================================================= */

        @media (max-width: 480px) {

            header {
                height: 60px;
            }

            main {
                min-height: calc(100vh - 60px);
                padding: 20px 15px;
            }

            .logo {
                font-size: 18px;
            }

            .auth-card {
                padding: 25px 20px;
            }

            .page-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .delete-workout-button {
                width: 100%;
            }

            .details-link {
                justify-content: center;
            }

            .card {
                padding: 20px;
            }

            .exercise-title h2 {
                font-size: 18px;
            }

            .set-input {
                width: 100%;
                min-width: 100%;
            }

            .set-value {
                font-size: 13px;
            }

            .delete-exercise-button {
                width: 100%;
            }

        }

        .statistics-card {
    padding: 25px;
}

.statistics-header {
    display: flex;
    align-items: center;
    gap: 12px;

    margin-bottom: 25px;
}

.statistics-header h2 {
    margin-bottom: 4px;
}

.statistics-header p {
    color: #888888;
    font-size: 14px;
}

.statistics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    border-top: 1px solid #252525;
    border-bottom: 1px solid #252525;

    margin-bottom: 20px;
}

.stat-item {
    display: flex;
    flex-direction: column;

    padding: 20px;

    text-align: center;
}

.stat-item + .stat-item {
    border-left: 1px solid #252525;
}

.stat-value {
    margin-bottom: 5px;

    color: #ffffff;
    font-size: 28px;
    font-weight: 600;
}

.stat-label {
    color: #888888;
    font-size: 14px;
}


/* Дополнительная информация */

.statistics-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.stat-detail {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 15px;

    background: #151515;
    border: 1px solid #252525;
    border-radius: 9px;
}

.stat-detail-icon {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 38px;
    height: 38px;

    flex-shrink: 0;

    background: #1c1c1c;
    border-radius: 8px;

    color: #ff6b00;
}

.stat-detail-icon svg {
    width: 19px;
    height: 19px;
}

.stat-detail > div:last-child {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.stat-detail-label {
    color: #777777;
    font-size: 12px;
}

.stat-detail-value {
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
}

.stat-detail-extra {
    color: #888888;
    font-size: 12px;
}

.table-card {
    padding: 0;
    overflow: hidden;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.history-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

.history-table th {
    padding: 16px 20px;
    text-align: left;

    color: #888;
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;

    border-bottom: 1px solid #252525;
    background: #111111;
}

.history-table td {
    padding: 17px 20px;

    color: #fff;
    font-size: 14px;

    border-bottom: 1px solid #1d1d1d;
}

.history-table tbody tr {
    transition: background 0.2s;
}

.history-table tbody tr:hover {
    background: #151515;
}

.history-table tbody tr:last-child td {
    border-bottom: none;
}

.date-cell {
    color: #888 !important;
    white-space: nowrap;
}

.exercise-cell {
    font-weight: 500;
}

.value-cell {
    font-weight: 500;
    white-space: nowrap;
}

.muted {
    color: #555 !important;
}

.muscle-tag {
    display: inline-block;

    padding: 5px 10px;

    border: 1px solid #252525;
    border-radius: 6px;

    color: #ffffff;
    background: #ff6b00;

    font-size: 12px;
}

.empty-table {
    text-align: center !important;
    padding: 50px !important;
    color: #666 !important;
}

/* Мобильная версия */

@media (max-width: 600px) {

    .statistics-grid {
        grid-template-columns: 1fr;
    }

    .stat-item + .stat-item {
        border-left: none;
        border-top: 1px solid #252525;
    }

    .statistics-details {
        grid-template-columns: 1fr;
    }

}
    </style>
</head>



<body>

<header>
    <a href="{% url 'home' %}" class="logo">
        WORKOUT<span>TRACKER</span>
    </a>

    {% if user.is_authenticated %}
        <nav class="nav">
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'workout_list' %}">Тренировки</a>
            <a href="{% url 'history' %}">История</a>
            <a href="{% url 'logout' %}" class="logout">Выйти</a>

        </nav>
    {% endif %}
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>

</body>
</html>
